name: Build MPC-BE

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - .github/workflows/main.yml
      - '**.txt'
      - '**.md'
      - '**.cmd'
      - '**.bat'
      - '**.manifest.conf'
      - '**.manifest.template'
      - include/Version.h
  pull_request:
    paths-ignore:
      - .github/workflows/main.yml
      - '**.txt'
      - '**.md'
      - '**.cmd'
      - '**.bat'
      - '**.vcxproj.filters'
      - '**.manifest.conf'
      - '**.manifest.template'
      - include/Version.h

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare MSYS
        run: |
          curl -sSL https://github.com/Aleksoid1978/MSYS/raw/main/MSYS_MinGW-w64_GCC_1521_x86-x64.7z -o MSYS.7z
          7z x MSYS.7z -oC:\\MSYS
          echo '@ECHO OFF' > environments.bat
          echo 'SET "MPCBE_MSYS=C:\\MSYS"' >> environments.bat
          echo 'SET "MPCBE_MINGW=C:\\MSYS\\mingw"' >> environments.bat
          .\\update_gcc.bat
        shell: pwsh

      - name: Build thdatmos (TrueHD and E-AC-3 decoder)
        run: |
          rustup update stable
          cargo build --release --manifest-path src/ExtLib/thdatmos/Cargo.toml
          New-Item -ItemType Directory -Force -Path distrib/thdatmos/x64 | Out-Null
          Copy-Item src/ExtLib/thdatmos/target/release/thdatmos.dll distrib/thdatmos/x64/thdatmos.dll
        shell: pwsh

      - name: Clean
        run: |
          .\\build.bat Clean x64 Filters NoWait
        shell: pwsh

      - name: Build MPC SpatialClock
        run: |
          .\\build.bat Build x64 Filters NoWait
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item _bin/Filters_x64/MpcSpatialClock.ax out/
          Copy-Item distrib/thdatmos/x64/thdatmos.dll out/
          Copy-Item distrib/atmos/*.bat out/
        shell: pwsh

      - name: Upload renderer
        uses: actions/upload-artifact@v7
        with:
          name: "MPC SpatialClock x64"
          path: out/*

      - name: Draft release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "rel/MPC SpatialClock"
          New-Item -ItemType Directory -Force -Path "$dir/Licenses" | Out-Null
          Copy-Item out/* $dir/
          Copy-Item LICENSE.txt "$dir/Licenses/MPC-BE (GPL-3.0).txt"
          Copy-Item src/ExtLib/openjoc/LICENSE "$dir/Licenses/OpenJOC (Apache-2.0).txt"
          $zip = "MPC-SpatialClock-${{ github.ref_name }}-x64.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          gh release create "${{ github.ref_name }}" $zip --draft --title "MPC SpatialClock ${{ github.ref_name }}" --notes-file distrib/atmos/release-notes.md
        shell: pwsh
